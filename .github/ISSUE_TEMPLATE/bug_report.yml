name: Bug report
description: Report a bug with the Renpho Fitness Scale BLE integration.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a report.

        Before submitting, please:

        - Check **Settings → Repairs** in Home Assistant — a repair card may already explain what's wrong.
        - Skim the [Troubleshooting section of the README](https://github.com/ronnnnnnnnnnnnn/renpho_fitness_scale_ble#troubleshooting).
        - If the scale doesn't connect, returns no data, or the values are clearly wrong, this is might be a protocol-level compatibility issue — see [Diagnosing Protocol Compatibility](https://github.com/ronnnnnnnnnnnnn/renpho_fitness_scale_ble#diagnosing-protocol-compatibility) first.
        - Download diagnostics from your scale's device card (**Settings → Devices & Services → Renpho Fitness Scale BLE → your scale → Download Diagnostics**) and attach the JSON file at the bottom of this form.

  - type: input
    id: marketed_model
    attributes:
      label: Marketed model
      description: As shown on the box or product listing (e.g. ES-CS20M, ES-32MD, ES-30M).
      placeholder: ES-CS20M
    validations:
      required: true

  - type: input
    id: hvin
    attributes:
      label: HVIN (with revision suffix)
      description: |
        Printed on the regulatory sticker on the back of the scale. Include the trailing revision code — the suffix (`A2`, `B2`, …) is what determines protocol compatibility.

        See the [Supported Devices](https://github.com/ronnnnnnnnnnnnn/renpho_fitness_scale_ble#supported-devices) section for examples. This field is required: HVIN is not readable over BLE, so it can't be inferred from the diagnostics dump.
      placeholder: ESCS20MA2
    validations:
      required: true

  - type: input
    id: ble_name
    attributes:
      label: BLE advertised name
      description: |
        How the scale appears in **Settings → Devices & Services** or in HA's bluetooth logs — typically starts with `Renpho-Scale`, `QN-Scale`, or a MAC address. Helps verify the integration's discovery filter actually picked up your model.
      placeholder: Renpho-Scale-XXXX
    validations:
      required: false

  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      description: Settings → About.
      placeholder: "2026.4.1"
    validations:
      required: true

  - type: input
    id: integration_version
    attributes:
      label: Integration version
      description: Visible on the scale's device card under **Configuration**.
      placeholder: "0.1.2"
    validations:
      required: true

  - type: input
    id: firmware
    attributes:
      label: Scale firmware revision
      description: Shown on the device card under `sw_version`.
      placeholder: "1.0.5"
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: What happens
      description: Describe the bug and what you expected to happen instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Step on the scale
        2. ...
        3. ...
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: |
        For BLE / connection issues, enable **Verbose library logging** under the integration's Advanced Settings, reproduce the problem, and paste the relevant log lines here.
      render: shell
    validations:
      required: false

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics dump
      description: Drag the downloaded `.json` file into this field to attach it.
    validations:
      required: false
